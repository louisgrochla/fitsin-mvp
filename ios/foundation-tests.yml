name: FitsinFoundationChecks
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    GENERATE_INFOPLIST_FILE: YES
targets:
  FitsinFoundationTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - FitsinMVPTests
      - FitsinMVP/Models/Models.swift
      - FitsinMVP/Networking/APIClient.swift
      - FitsinMVP/Storage/KeychainStore.swift
      - FitsinMVP/Storage/LocalCache.swift
      - FitsinMVP/ViewModels/TodayViewModel.swift
      - FitsinMVP/ViewModels/MonthViewModel.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.fitsin.foundationtests
schemes:
  FitsinFoundationTests:
    build:
      targets:
        FitsinFoundationTests: all
    test:
      targets:
        - FitsinFoundationTests
