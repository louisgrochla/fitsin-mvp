name: FitsinMVP
options:
  deploymentTarget:
    iOS: "17.0"
packages:
  GoogleSignIn:
    url: https://github.com/google/GoogleSignIn-iOS
    from: "8.0.0"
settings:
  base:
    PRODUCT_BUNDLE_IDENTIFIER: com.fitsin.mvp
    SWIFT_VERSION: 5.0
targets:
  FitsinMVP:
    type: application
    platform: iOS
    sources:
      - FitsinMVP
    resources:
      - FitsinMVP/Resources
    entitlements:
      path: FitsinMVP/Resources/FitsinMVP.entitlements
      properties:
        aps-environment: production
    dependencies:
      - package: GoogleSignIn
        product: GoogleSignIn
    settings:
      base:
        INFOPLIST_FILE: FitsinMVP/Resources/Info.plist
        PRODUCT_NAME: FitsinMVP
        CODE_SIGN_ENTITLEMENTS: FitsinMVP/Resources/FitsinMVP.entitlements
      configs:
        Debug:
          base:
            API_BASE_URL: https://fitsin-mvp.onrender.com
        Release:
          base:
            API_BASE_URL: https://fitsin-mvp.onrender.com
    scheme:
      testTargets: []
